name: Pages

# Publishes X-Cube Lab to GitHub Pages (https://ahernsean.github.io/x-cube/) whenever
# main changes. The repository's Pages source must be set to "GitHub Actions"
# (Settings > Pages > Build and deployment > Source).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the one in progress rather than
# cancelling it, so a deployment is never left half done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish the Lab
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-web.ts
      # Only the standalone page is published; dist/x-cube-lab.html is the artifact's body.
      - name: Collect the site
        run: mkdir -p _site && cp dist/index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
