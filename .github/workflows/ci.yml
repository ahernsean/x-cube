name: CI

# Pull requests are tested on every push to them; main is tested when commits land.
# A branch push without a pull request is not tested, so each pull request update runs
# CI once rather than twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per pull request: a new push cancels the run the previous push started.
# Every other run (main, manual) gets its own group, so none is cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The unit tests and the typecheck are separate jobs because neither implies the other:
  # Node runs the TypeScript by stripping the types without checking them, so tests can
  # pass with type errors. As separate jobs, both always run and each reports on its own.
  # (The build runs in the browser jobs.)
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Node's built-in coverage; the table goes to the log and the run's summary page.
      - name: Run the unit tests with coverage
        shell: bash
        run: npm run test:coverage | tee unit-tests.log
      - name: Add unit test coverage to the summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Unit test coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' unit-tests.log | sed 's/^# //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  # WebKit is the engine of Safari, and of every browser on iPhone and iPad.
  browser:
    name: Browser tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            label: Chromium
          - browser: webkit
            label: WebKit / Safari
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromium also records coverage, which needs a source map in the build and the
      # coverage reporter. Like Playwright, the reporter is not a project dependency.
      - run: node scripts/build-web.ts ${{ matrix.browser == 'chromium' && '--sourcemap' || '' }}
      - run: npm install --no-save playwright@1.64.1 ${{ matrix.browser == 'chromium' && 'monocart-coverage-reports@2.13.2' || '' }}

      # WebKit's system libraries are a large set of Ubuntu packages, and the runner's
      # package mirror can be slow to serve them. The downloaded .deb files are cached
      # between runs; apt uses a cached file only when its version and checksum match the
      # index, so a stale cache costs time, not correctness. The key follows the runner
      # image and the Playwright version, which together set the package list.
      - name: Find the runner image
        if: matrix.browser == 'webkit'
        id: image
        run: echo "name=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Restore WebKit's system packages
        if: matrix.browser == 'webkit'
        uses: actions/cache@v6
        with:
          path: ~/webkit-packages
          key: webkit-packages-${{ steps.image.outputs.name }}-playwright-1.64.1
      - name: Seed apt with the restored packages
        if: matrix.browser == 'webkit'
        run: |
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloaded-packages
          mkdir -p ~/webkit-packages
          shopt -s nullglob
          packages=(~/webkit-packages/*.deb)
          echo "Restored ${#packages[@]} packages"
          if (( ${#packages[@]} )); then sudo cp "${packages[@]}" /var/cache/apt/archives/; fi
      # The runner image's package lists can name versions the mirrors no longer have (404),
      # so refresh them first, retrying while the mirrors' names don't resolve.
      - name: Refresh apt's package lists
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update failed (attempt $attempt); retrying"
            sleep 15
          done
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Chromium draws with Mesa's llvmpipe, much faster than its own SwiftShader, which it
      # quietly falls back to without Mesa's EGL (see scripts/browser-tests.mjs).
      - name: Install Mesa's EGL and llvmpipe for Chromium
        if: matrix.browser == 'chromium'
        run: sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Keep WebKit's system packages for the cache
        if: matrix.browser == 'webkit'
        run: |
          shopt -s nullglob
          packages=(/var/cache/apt/archives/*.deb)
          echo "Keeping ${#packages[@]} packages"
          if (( ${#packages[@]} )); then cp "${packages[@]}" ~/webkit-packages/; fi

      - run: node --test scripts/browser-tests.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          COVERAGE_DIR: ${{ matrix.browser == 'chromium' && 'coverage/browser' || '' }}
          EXPECT_RENDERER: ${{ matrix.browser == 'chromium' && 'llvmpipe' || '' }}
      - name: Add browser test coverage to the summary
        if: always() && matrix.browser == 'chromium'
        run: |
          echo '### Browser test coverage (Chromium)' >> "$GITHUB_STEP_SUMMARY"
          cat coverage/browser/coverage-summary.md >> "$GITHUB_STEP_SUMMARY" || echo 'No coverage report' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the browser coverage report
        if: always() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@v7
        with:
          name: browser-coverage
          path: coverage/browser
          if-no-files-found: ignore

  # The single check for a branch rule on main to require. It passes only when every job
  # above passed, so the pull request cannot be merged while any of them is running or
  # failed. The rule matches this display name: renaming the job means changing the rule.
  all-checks:
    name: all checks
    # Runs after the other jobs whether they passed or failed, but not when the run is
    # cancelled (a newer push to the pull request replaced it): then it is skipped, so a
    # replaced run reports no failure.
    if: ${{ !cancelled() }}
    needs: [unit-tests, typecheck, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$UNIT_TESTS_RESULT $TYPECHECK_RESULT $BROWSER_RESULT" = "success success success"
